# Production stack. The release workflow copies this file to the server,
# next to a hand-maintained .env holding POSTGRES_* and DOCKERHUB_USERNAME.
name: agentic-os

x-app-env: &app-env
  env_file: .env
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # $$ defers expansion to the container shell, which has the vars above
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    <<: *app-env
    image: ${DOCKERHUB_USERNAME:?set DOCKERHUB_USERNAME in .env}/agentic-os-migrate:${IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy

  server:
    <<: *app-env
    image: ${DOCKERHUB_USERNAME:?set DOCKERHUB_USERNAME in .env}/agentic-os-server:${IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
    name: agentic-os-pg-data
